<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EUR/USD">
  <defs>
    <linearGradient id="eurusd-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003399"/>
      <stop offset="60%" stop-color="#001F60"/>
      <stop offset="100%" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold-euro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FFB700"/>
    </linearGradient>
    <linearGradient id="green-usd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="20" fill="url(#eurusd-bg)"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="#FFDD00" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.65"/>
  <text x="23" y="38" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="900" fill="url(#gold-euro)">€</text>
  <text x="32" y="36" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">/</text>
  <text x="43" y="38" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="900" fill="url(#green-usd)">$</text>
</svg>
