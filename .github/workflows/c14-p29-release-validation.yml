name: C14-P29 internal release validation

on:
  push:
    branches:
      - parallel/c14-p29-release-validation

permissions:
  contents: read

concurrency:
  group: c14-p29-release-validation
  cancel-in-progress: false

jobs:
  exact-sha-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: c14_p29_ephemeral_ci_only
          POSTGRES_DB: c13_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d c13_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUALIFIED_SHA: 4cb45bbcf910f0517d4a5d265682cd2f7e4e41df
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: "true"
      C6_SOURCE_SHA: 4cb45bbcf910f0517d4a5d265682cd2f7e4e41df
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: c14_p29_ephemeral_ci_only
      PGDATABASE: c13_fixture
    steps:
      - name: Checkout validator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: validator
          persist-credentials: false

      - name: Checkout exact subject SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.QUALIFIED_SHA }}
          fetch-depth: 0
          path: subject
          persist-credentials: false

      - name: Set up Node 24.18.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"

      - name: Install isolated Redis prerequisite
        run: |
          set -euo pipefail
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server
          fi
          redis-server --version

      - name: Re-run C13 source-derived qualification at exact SHA
        if: always()
        continue-on-error: true
        working-directory: subject
        run: |
          set -euo pipefail
          GITHUB_SHA="$QUALIFIED_SHA" GITHUB_REF_NAME="parallel/c14-p29-release-validation" \
            python3 scripts/c13/qualify.py
          GITHUB_SHA="$QUALIFIED_SHA" GITHUB_REF_NAME="parallel/c14-p29-release-validation" \
            python3 scripts/c13/ci-extra.py

      - name: Re-run Shield database fixture at exact SHA
        if: always()
        continue-on-error: true
        working-directory: subject
        run: |
          set -euo pipefail
          mkdir -p /tmp/c13-sql
          GITHUB_SHA="$QUALIFIED_SHA" python3 scripts/c13/shield-db-test.py \
            2>&1 | tee /tmp/c13-sql/execution.log

      - name: Re-run frozen benchmark at exact SHA
        if: always()
        continue-on-error: true
        working-directory: subject
        run: |
          set -euo pipefail
          GITHUB_SHA="$QUALIFIED_SHA" bash scripts/c13/benchmark.sh

      - name: C14-P29 conservative release gate
        if: always()
        id: gate
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/c14-p29
          python3 validator/scripts/c14-p29/verify_release_evidence.py \
            --evidence /tmp/c13-evidence \
            --sql /tmp/c13-sql \
            --benchmark /tmp/c13-benchmark \
            --criteria validator/scripts/c14-p29/release-criteria.json \
            --base-sha "$QUALIFIED_SHA" \
            --output /tmp/c14-p29/VERDICT.json

      - name: Build combined artifact manifest
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/c14-p29
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          roots = [
              Path("/tmp/c13-evidence"),
              Path("/tmp/c13-sql"),
              Path("/tmp/c13-benchmark"),
              Path("/tmp/c14-p29"),
          ]
          rows = []
          for root in roots:
              if not root.exists():
                  continue
              for p in sorted(root.rglob("*")):
                  if p.is_file() and p.name != "ARTIFACT_MANIFEST.json":
                      rows.append({
                          "root": str(root),
                          "path": str(p.relative_to(root)),
                          "bytes": p.stat().st_size,
                          "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                      })
          out = {
              "schema": "velmere.c14-p29.artifact-manifest.v1",
              "subjectSha": os.environ["QUALIFIED_SHA"],
              "files": rows,
          }
          Path("/tmp/c14-p29/ARTIFACT_MANIFEST.json").write_text(
              json.dumps(out, indent=2) + "\n"
          )
          PY

      - name: Upload C14-P29 qualification package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c14-p29-release-validation-${{ github.run_id }}
          path: |
            /tmp/c13-evidence
            /tmp/c13-sql
            /tmp/c13-benchmark
            /tmp/c14-p29
          retention-days: 30
          if-no-files-found: error

      - name: Keep release gate red when any required gate fails
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/c14-p29/VERDICT.json

          python3 - <<'PY'
          import json, sys
          gate = json.load(open("/tmp/c14-p29/VERDICT.json"))
          print(json.dumps(gate, indent=2))
        if gate["decision"] != "GO":
            sys.exit(1)
          PY
