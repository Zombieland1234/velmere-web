name: Materialize reviewed C10 public receipt fix
on:
  push:
    branches: [c10/customer-runtime-qualification-20260917]
    paths: [scripts/c10-stage/pdf-fix.bin]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply reviewed exact-parent patch and remove transport files
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'c10/customer-runtime-qualification-20260917'
          test "$(git rev-parse HEAD^)" = '4be5db8a93ddd467b92eb5ac39fbf391139e08e2'
          python3 - <<'PY'
          import pathlib,gzip,hashlib,json,subprocess
          raw=pathlib.Path('scripts/c10-stage/pdf-fix.bin').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='19c5bc09375e92425d4dc03d92055cc8d20429aef223bb984489a5df38d51c0d'
          data=gzip.decompress(raw)
          assert hashlib.sha256(data).hexdigest()=='18f9f194edc419ed62766c94179f3965f123cd8e7a5d1782218618fbf07fbd48'
          payload=json.loads(data);assert set(payload)=={'patch','appendPath','append'}
          assert payload['appendPath']=='scripts/c10/rpc-http.test.ts'
          pathlib.Path('/tmp/c10-pdf.patch').write_text(payload['patch'])
          subprocess.run(['git','apply','--check','/tmp/c10-pdf.patch'],check=True)
          subprocess.run(['git','apply','/tmp/c10-pdf.patch'],check=True)
          p=pathlib.Path(payload['appendPath']);p.write_text(p.read_text()+payload['append'])
          PY
          git rm -r scripts/c10-stage
          git rm .github/workflows/c10-pdf-receipt-fix.yml
          git diff --check
          git config user.name 'Velmere C10 integration'
          git config user.email 'c10-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(c10): retain typed public block receipt in PDF and qualify reference copy'
          cat >/tmp/askpass.sh <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$PUSH_TOKEN";; esac
          SH
          chmod 700 /tmp/askpass.sh
          GIT_ASKPASS=/tmp/askpass.sh GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/c10/customer-runtime-qualification-20260917
          git rev-parse HEAD
          echo 'Fresh qualification requires an exact-SHA trigger.'
