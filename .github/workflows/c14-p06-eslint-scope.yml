name: C14 P06 ESLint active-source scope

on:
  push:
    branches:
      - parallel/c14-p06-eslint-errors
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/c14-p06-eslint-scope.yml"
  pull_request:
    branches:
      - main
    paths:
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.mts"
      - "**/*.cts"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - ".github/workflows/c14-p06-eslint-scope.yml"

permissions:
  contents: read

jobs:
  eslint-active-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-fund
      - name: Prove the coverage guard rejects hidden tracked source
        run: |
          set -euo pipefail
          mkdir -p archive
          printf 'export const c14P06HiddenFixture = true;\n' > archive/c14-p06-hidden-fixture.ts
          git add -f archive/c14-p06-hidden-fixture.ts
          if npm run lint:coverage > /tmp/c14-p06-negative-control.log 2>&1; then
            cat /tmp/c14-p06-negative-control.log
            echo "Coverage guard unexpectedly accepted a tracked source file hidden by ESLint ignores." >&2
            exit 1
          fi
          grep -F '"archive/c14-p06-hidden-fixture.ts"' /tmp/c14-p06-negative-control.log
          grep -F "ESLint coverage guard failed" /tmp/c14-p06-negative-control.log
          git reset -- archive/c14-p06-hidden-fixture.ts
          rm -f archive/c14-p06-hidden-fixture.ts
          test -z "$(git status --porcelain)"

      - name: Lint all tracked active source and verify traversal coverage
        run: npm run lint
