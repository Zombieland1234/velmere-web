name: C15 Q4 exact reviewed source admission
on:
  push:
    branches: [c15/qualification-q4-20260918]
    paths: [.github/workflows/c15-q4-admission.yml, '_handoff/q4-transfer/**']
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Validate payload and exact tree before committing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/q4-admission
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,json,subprocess,os
          base='8fa402530444103a9b3840f25a0e1f6d9498d422'
          expected='6c763729047e177fe9d0659c5d0ef27a0fedfbf0'
          stage=['_handoff/q4-transfer/part1.b64','_handoff/q4-transfer/part2.b64','_handoff/q4-transfer/part3.b64','.github/workflows/c15-q4-admission.yml']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          subprocess.check_call(['git','merge-base','--is-ancestor',base,'HEAD'])
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())==set(stage)
          parts=[Path(p).read_text().strip() for p in stage[:3]]
          def blob(s):
            b=(s+'\n').encode();return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          assert blob(parts[0])=='00f1c854c1c3b6d04cf29e68c32e8762fd84bda8'
          assert blob(parts[1])=='653608ab2aa4c7109cc1a36467ff677dde5ab5f7'
          before=blob(parts[2])
          # Four explicit transfer transcription corrections, not product changes.
          # Both original and corrected object identities are pinned; no relaxed gate.
          if before=='4dd8a32d9430ffbc2bd2890662a34e5b3f5526ea':
            for old,new in [('v7hweHe7vZhwMjv','v7hweHe7v7hwMjv'),('vt9kZ7yYmxj4ZW','vt9kZ7yYyxj4ZW'),('ZnN9q1nWg','ZnN9q9nWg'),('Grefjzba3ba3tb6x','Grefjzba3tb6x')]:
              assert parts[2].count(old)==1,old
              parts[2]=parts[2].replace(old,new)
          assert blob(parts[2])=='d35d0003ac121fb442e221ea54cd778f1525a571'
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='602330d31e116c5f98916bcd333cba914fd7212b860b43a69a414f5af48bceed'
          raw=gzip.decompress(packed)
          assert hashlib.sha256(raw).hexdigest()=='8303e143be474713faee5dd23779c4ab61caf7090769e918ba72c2f263f656cf'
          files=json.loads(raw)
          allowed=['scripts/c15-q4/entitlement-store.sql','scripts/c15-q4/native-postgres.py','scripts/c15-q4/bootstrap-roles.sql','scripts/c15-q4/store-contract.test.ts','tsconfig.c15-q4-tests.json','scripts/c14-integration/accepted-tests.json','.github/workflows/c15-q4-qualification.yml','_handoff/C15-Q4-ENTITLEMENT-STORE.md']
          assert isinstance(files,dict) and set(files)==set(allowed)
          for name,text in files.items():
            assert isinstance(text,str)
            p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)
          subprocess.check_call(['git','add','--',*allowed])
          subprocess.check_call(['git','rm','--',*stage])
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree==expected,(tree,expected)
          receipt={'baseSha':base,'triggerSha':os.environ['GITHUB_SHA'],'expectedTree':expected,'actualTree':tree,'exactTreeMatched':True,'transferPart3Before':before,'transferPart3After':blob(parts[2]),'scope':'EXACT_SOURCE_ADMISSION_NOT_RELEASE_APPROVAL','files':allowed}
          Path('/tmp/q4-admission/ADMISSION.json').write_text(json.dumps(receipt,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(c15-q4): admit exact reviewed isolated entitlement store and tests'
          git rev-parse HEAD | tee /tmp/q4-admission/COMMIT_SHA.txt
          git push origin HEAD:refs/heads/c15/qualification-q4-20260918
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c15-q4-admission-${{ github.run_id }}
          path: /tmp/q4-admission
          retention-days: 14
