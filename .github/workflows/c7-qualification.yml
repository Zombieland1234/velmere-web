name: C7 engine integrity and release qualification
on:
  push:
    branches: [c7/engine-integrity-20260917]
permissions:
  contents: write
concurrency:
  group: c7-engine-integrity-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Materialize reviewed C7 engine-integrity patch exactly once
        id: materialize
        env:
          C7_PUSH_TOKEN: ${{ github.token }}
        run: |
          if [ -f release/c7/C7_PATCH_APPLIED ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$GITHUB_REF_NAME" = "c7/engine-integrity-20260917"
          cat scripts/c7/.patch.part01 scripts/c7/.patch.part02 scripts/c7/.patch.part03 scripts/c7/.patch.part04 scripts/c7/.patch.part05 > /tmp/c7.patch.gz.b64
          base64 -d /tmp/c7.patch.gz.b64 | gzip -d > /tmp/c7.patch
          test "$(sha256sum /tmp/c7.patch | cut -d' ' -f1)" = "ccfcae69cb9f89bf4053ba68f559791163f057e78e53dcfc10a8c721b5b2abae"
          git apply --check /tmp/c7.patch
          git apply /tmp/c7.patch
          mkdir -p release/c7
          printf 'seedSha=%s\nmaterializedAt=%s\npatchSha256=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(sha256sum /tmp/c7.patch | cut -d' ' -f1)" > release/c7/C7_PATCH_APPLIED
          git rm scripts/c7/.patch.part01 scripts/c7/.patch.part02 scripts/c7/.patch.part03 scripts/c7/.patch.part04 scripts/c7/.patch.part05
          git diff --check
          git config user.name 'Velmere C7 qualification'
          git config user.email 'c7-qualification@users.noreply.github.com'
          git add -A
          git commit -m 'fix(c7): enforce engine evidence integrity and coverage gates'
          cat > /tmp/c7-askpass.sh <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$C7_PUSH_TOKEN";; esac
          SH
          chmod 700 /tmp/c7-askpass.sh
          export GIT_ASKPASS=/tmp/c7-askpass.sh GIT_TERMINAL_PROMPT=0
          git push origin HEAD:refs/heads/c7/engine-integrity-20260917
          echo "materialized=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.materialize.outputs.materialized != 'true'
        with:
          node-version: '24.18.0'
      - name: Full source qualification
        if: steps.materialize.outputs.materialized != 'true'
        run: python3 scripts/c7/qualify.py
      - name: Source-derived product manifest
        if: steps.materialize.outputs.materialized != 'true' && always()
        run: |
          if [ -x node_modules/.bin/tsx ]; then
            node_modules/.bin/tsx -e "import{VLM_CANONICAL_CUSTOMER_PRODUCTS as products}from'./lib/product/vlm-canonical-product-topology';import fs from'node:fs';import{createHash}from'node:crypto';const p='lib/product/vlm-canonical-product-topology.ts';fs.writeFileSync('/tmp/c7-evidence/PRODUCT_MANIFEST.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,recordedAt:new Date().toISOString(),topologyPath:p,topologySha256:createHash('sha256').update(fs.readFileSync(p)).digest('hex'),catalogCount:products.length,activeOrSellableCount:'NOT_ASSUMED_FROM_CATALOG_COUNT',products},null,2));"
          fi
      - name: Redacted tracked-source secret scan and dependency drift inventory
        if: steps.materialize.outputs.materialized != 'true' && always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/c7-scan /tmp/c7-tools /tmp/c7-evidence
          git archive HEAD | tar -x -C /tmp/c7-scan
          curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/c7-tools/checksums.txt
          curl --fail --silent --show-error --location --max-time 90 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/c7-tools/gitleaks_8.30.1_linux_x64.tar.gz
          (cd /tmp/c7-tools; grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -; tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          python3 - <<'PYSCAN'
          import subprocess,pathlib,json,datetime,hashlib,os
          out=pathlib.Path('/tmp/c7-evidence');rows=[]
          commands=[('gitleaks-tracked-source',['/tmp/c7-tools/gitleaks','dir','/tmp/c7-scan','--redact=100','--no-banner','--no-color','--ignore-gitleaks-allow','--max-archive-depth','2','--max-decode-depth','2','--report-format','json','--report-path',str(out/'GITLEAKS_REDACTED.json')]),('dependency-outdated',['npm','outdated','--json']),('software-bill-of-materials',['npm','sbom','--sbom-format','cyclonedx'])]
          for name,args in commands:
            log=out/(name+'.log');started=datetime.datetime.now(datetime.timezone.utc).isoformat()
            with log.open('wb') as f:
              try:code=subprocess.run(args,stdout=f,stderr=subprocess.STDOUT,timeout=240).returncode
              except subprocess.TimeoutExpired:code=124
            rows.append({'id':name,'sourceSha':os.environ.get('GITHUB_SHA'),'startedAt':started,'finishedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'command':args,'exitCode':code,'log':log.name,'logSha256':hashlib.sha256(log.read_bytes()).hexdigest(),'scope':'SOURCE_DIRECTORY_NOT_GIT_HISTORY' if name.startswith('gitleaks') else 'INVENTORY_NOT_AUTOMATIC_RELEASE_PASS'})
          (out/'ADDITIONAL_SCANS.json').write_text(json.dumps(rows,indent=2))
          PYSCAN
      - name: Actual built-page browser and reference PDF evidence
        if: steps.materialize.outputs.materialized != 'true' && always()
        continue-on-error: true
        run: |
          if [ -x node_modules/.bin/next ] && node -e "const fs=require('fs');const p='/tmp/c7-evidence/QUALIFICATION.json';if(!fs.existsSync(p))process.exit(1);const a=require(p);if(!a.find(x=>x.id==='production-build'&&x.result==='PASS'))process.exit(1)"; then
            node_modules/.bin/playwright install --with-deps chromium > /tmp/c7-evidence/browser-install.log 2>&1
            node_modules/.bin/next start --hostname localhost > /tmp/c7-evidence/next-runtime.log 2>&1 &
            server=$!; trap 'kill "$server" || true' EXIT
            for i in $(seq 1 30); do if curl -s -o /dev/null http://localhost:3000/en; then break; fi; sleep 1; done
            timeout 300 node scripts/c6/browser-observations.mjs http://localhost:3000 /tmp/c7-evidence/browser > /tmp/c7-evidence/browser.log 2>&1
            timeout 90 node scripts/c6c/provider-outage-browser.mjs /tmp/c7-evidence/failures > /tmp/c7-evidence/controlled-failures.log 2>&1
            timeout 90 node scripts/c6d/reference-pdf-browser.mjs /tmp/c7-evidence/pdf > /tmp/c7-evidence/pdf-browser.log 2>&1
          fi
      - name: Export complete exact committed source and evidence checksums
        if: steps.materialize.outputs.materialized != 'true' && always()
        run: |
          python3 - <<'PYEXP'
          import pathlib,subprocess,zipfile,hashlib,json,datetime,os
          out=pathlib.Path('/tmp/c7-evidence');out.mkdir(exist_ok=True);src=pathlib.Path('/tmp/c7-source');src.mkdir(exist_ok=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();files=[]
          with zipfile.ZipFile(src/'VELMERE_SOURCE_C7.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'):
              if not name:continue
              raw=subprocess.check_output(['git','show','HEAD:'+name]);files.append({'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()});z.writestr(name,raw)
          identity={'sourceSha':sha,'treeSha':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'repository':'Zombieland1234/velmere-web','branch':os.environ.get('GITHUB_REF_NAME'),'originalUI2ZipIdentityConfirmed':False,'trackedFilesIncluded':len(files),'excludedTrackedFiles':[],'files':files,'zipSha256':hashlib.sha256((src/'VELMERE_SOURCE_C7.zip').read_bytes()).hexdigest()}
          (src/'SOURCE_IDENTITY.json').write_text(json.dumps(identity,indent=2));(out/'SOURCE_IDENTITY_EXPORT.json').write_text(json.dumps({k:v for k,v in identity.items() if k!='files'},indent=2))
          subprocess.run(['git','status','--porcelain'],stdout=(out/'final-working-tree-status.txt').open('w'),check=True)
          items=[{'path':str(p.relative_to(out)),'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'EVIDENCE_MANIFEST.json').write_text(json.dumps({'sourceSha':sha,'recordedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'files':items},indent=2))
          PYEXP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.materialize.outputs.materialized != 'true' && always()
        with:
          name: c7-source-${{ github.run_id }}
          path: /tmp/c7-source
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.materialize.outputs.materialized != 'true' && always()
        with:
          name: c7-evidence-${{ github.run_id }}
          path: /tmp/c7-evidence
          retention-days: 14
          if-no-files-found: error
      - name: Honest technical gate without production promotion
        if: steps.materialize.outputs.materialized != 'true' && always()
        run: |
          python3 - <<'PYGATE'
          import pathlib,json,sys
          out=pathlib.Path('/tmp/c7-evidence');p=out/'QUALIFICATION.json'
          if not p.exists():sys.exit('Missing full source checks; NO_GO')
          rows=json.loads(p.read_text())
          required={'clean-install','strict-typescript','eslint-zero-warning','dependency-audit','dependency-tree','actual-route-and-regression-tests','source-truth-audit','production-build','engine-observations'}
          got={x['id'] for x in rows if x['result']=='PASS'}
          missing=sorted(required-got)
          if missing:sys.exit('Technical qualification failed: '+','.join(missing))
          engine=json.loads((out/'engine/ENGINE_OBSERVATIONS.json').read_text())
          if any(x['result']!='PASS' for x in engine['rows']):sys.exit('Engine targeted observations still contain FP/FN; NO_GO')
          print('C7 technical code gate PASS. Release remains NO_GO until paid lifecycle, hosted auth/provider E2E and independent review are separately evidenced.')
          PYGATE
