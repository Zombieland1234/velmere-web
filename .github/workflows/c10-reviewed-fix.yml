name: Materialize reviewed C10 integration fixes
on:
  push:
    branches: [c10/customer-runtime-qualification-20260917]
    paths: ['scripts/c10-stage/fix2-*.bin']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply only the hash-locked reviewed patch to its exact parent
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'c10/customer-runtime-qualification-20260917'
          test "$(git rev-parse HEAD^)" = '2cdd62f9fbb8663a66fbf6766e2521043b707f24'
          python3 - <<'PY'
          import pathlib,gzip,hashlib,subprocess
          parts=sorted(pathlib.Path('scripts/c10-stage').glob('fix2-*.bin'));assert len(parts)==3
          data=b''.join(p.read_bytes() for p in parts)
          assert hashlib.sha256(data).hexdigest()=='72c10af4aa511e711e4ebc600be8099d76bebcb9cd84d61b448ad422ea0d54b1'
          patch=gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='c95f8405d64ec3785b55d57137e02b92aee23c50dbab1653eb54a105ccb79120'
          pathlib.Path('/tmp/reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/reviewed.patch'],check=True)
          subprocess.run(['git','apply','/tmp/reviewed.patch'],check=True)
          PY
          git rm -r scripts/c10-stage
          git rm .github/workflows/c10-reviewed-fix.yml
          git diff --check
          git config user.name 'Velmere C10 integration'
          git config user.email 'c10-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(c10): bind wire digests, canonical chains, runtime quotas and nullable metrics'
          cat >/tmp/askpass.sh <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$PUSH_TOKEN";; esac
          SH
          chmod 700 /tmp/askpass.sh
          GIT_ASKPASS=/tmp/askpass.sh GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/c10/customer-runtime-qualification-20260917
          git rev-parse HEAD
          echo 'Integration only. Fresh qualification requires a new exact-SHA trigger.'
