name: C14 P22 provider enforcement qualification

on:
  push:
    branches:
      - parallel/c14-p22-provider-enforcement
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c14-p22-provider-enforcement
  cancel-in-progress: true

jobs:
  provider-enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: C14 P22 enforcement regression
        run: npx tsx scripts/c14/test-provider-enforcement.ts
      - name: Static provider egress coverage
        run: node scripts/c14/audit-provider-egress-coverage.mjs
      - name: Project rights evidence inputs
        run: |
          test -f config/pass21/provider-commercial-rights-registry.json
          test -f config/pass36/a102r44p18-official-provider-rights-decision-matrix.json
          test -f config/p65/P65_CURRENT_FREE_LEGAL_SOURCE_POLICY.json
          test -f config/p90/audit-provider-field-rights-currentness-registry.json
          test -f artifacts/r7/providers/R7_ECB_USAGE_POLICY_REVIEW_20260824.json
      - name: Strict TypeScript
        run: npx tsc --noEmit --pretty false
