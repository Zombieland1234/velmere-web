name: C14-P18 paid-tier bypass qualification
on:
  push:
    branches: [parallel/c14-p18-paid-tier-bypass]
permissions:
  contents: read
jobs:
  paid-tier-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: C14-P18 entitlement scope/token/concurrency regression
        run: npx --no-install tsx scripts/c14/test-paid-tier-bypass.ts
      - name: C14-P18 canonical 20-product matrix
        run: npx --no-install tsx scripts/c14/test-paid-tier-catalog-matrix.ts
      - name: C14-P18 report restore cache export attack surfaces
        run: node scripts/c14/test-paid-tier-attack-surfaces.mjs
      - name: TypeScript
        run: npx --no-install tsc --noEmit
