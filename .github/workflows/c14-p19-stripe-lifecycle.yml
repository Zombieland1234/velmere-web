name: C14-P19 Stripe lifecycle qualification

on:
  push:
    branches: [parallel/c14-p19-stripe-lifecycle]
    paths-ignore:
      - "_handoff/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c14-p19-stripe-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      C14_P19_EVIDENCE_DIR: /tmp/c14-p19-evidence
      # Never inherit payment/database secrets into this local contract suite.
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      VELMERE_STRIPE_DURABLE_STORAGE_QUALIFIED: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.18.0"
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Reproducible lifecycle/source audit
        run: |
          set -euo pipefail
          mkdir -p "$C14_P19_EVIDENCE_DIR"
          node scripts/c14/stripe-lifecycle-static.mjs | tee "$C14_P19_EVIDENCE_DIR/STATIC_AUDIT.log"

      - name: Signed ingress + lifecycle contracts
        run: |
          set -euo pipefail
          npm run test:c14:p19:stripe 2>&1 | tee "$C14_P19_EVIDENCE_DIR/TESTS.log"

      - name: Diff hygiene
        run: git diff --check

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-p19-stripe-lifecycle-${{ github.run_id }}
          path: /tmp/c14-p19-evidence
          retention-days: 14
          if-no-files-found: warn
