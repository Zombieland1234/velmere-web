name: C14 internal integration qualification
on:
  push:
    branches: [c14/integration-final-20260918]
    paths-ignore: ['_handoff/**', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c14-integration-qualification
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
      C6_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0'}
      - run: python3 scripts/c14-integration/qualify-core.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-integration-core-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/c14-integration/
          retention-days: 14
          if-no-files-found: error
  frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0'}
      - run: bash scripts/c14-integration/benchmark.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-integration-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/c14-benchmark
            !/tmp/c14-benchmark/private-inputs.json
            !/tmp/c14-benchmark/*-engine.cjs
          retention-days: 14
          if-no-files-found: error
