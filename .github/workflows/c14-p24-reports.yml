name: C14 P24 report system qualification
on:
  push:
    branches: [parallel/c14-p24-reports]
permissions:
  contents: read
concurrency:
  group: c14-p24-reports
  cancel-in-progress: true
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      C6_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0'}
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: C14 P24 focused report regressions
        run: |
          mkdir -p /tmp/c14-p24
          set -o pipefail
          node_modules/.bin/tsx --test scripts/c14/reports.test.ts 2>&1 | tee /tmp/c14-p24/reports-test.log
      - name: Record source identity
        if: always()
        run: |
          git rev-parse HEAD > /tmp/c14-p24/SOURCE_SHA.txt
          git status --short > /tmp/c14-p24/GIT_STATUS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-p24-baseline-${{ github.run_id }}
          path: /tmp/c14-p24
          retention-days: 14
          if-no-files-found: error
