name: C14-C15 isolated runtime recovery and secret qualification
on:
  push:
    branches: [c14/integration-final-20260918, c15/call-status-qualification-20260918]
    paths-ignore: ['_handoff/**','docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
      C6_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24.18.0'}
      - run: |
          mkdir -p /tmp/c14-runtime
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-server
          node --version > /tmp/c14-runtime/NODE_VERSION.txt
          redis-server --version > /tmp/c14-runtime/REDIS_VERSION.txt
          printf '%s\n' "$GITHUB_SHA" > /tmp/c14-runtime/SOURCE_SHA.txt
      - run: npm ci --ignore-scripts --no-fund
      - name: Real Redis checks on a private temporary instance
        run: set -o pipefail; bash scripts/c12/redis-tests.sh 2>&1 | tee /tmp/c14-runtime/redis-tests.log
      - name: Production bundle from the full checkout
        run: set -o pipefail; npm run build 2>&1 | tee /tmp/c14-runtime/build.log
      - run: node_modules/.bin/playwright install --with-deps chromium
      - name: One real Basic runtime scenario, not paid or hosted E2E
        run: set -o pipefail; node scripts/c12/production-e2e.mjs /tmp/c14-runtime/e2e 2>&1 | tee /tmp/c14-runtime/e2e.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'c14-runtime-${{ github.run_id }}',path: /tmp/c14-runtime/,retention-days: 14,if-no-files-found: error}
  database-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_PASSWORD: c14_ephemeral_ci_only,POSTGRES_DB: c14_fixture}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: c14_ephemeral_ci_only
      PGDATABASE: c14_fixture
      C14_DISPOSABLE_RESTORE_ACK: ISOLATED_CI_ONLY
      C14_P16_EVIDENCE_DIR: /tmp/c14-restore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0,persist-credentials: false}
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server
      - name: Canonical Shield PostgreSQL regression
        run: |
          mkdir -p /tmp/c13-sql
          createdb c13_fixture
          set -o pipefail
          PGDATABASE=c13_fixture python3 scripts/c13/shield-db-test.py 2>&1 | tee /tmp/c13-sql/execution.log
      - name: Synthetic disposable PostgreSQL Redis object-file restore drill
        run: mkdir -p /tmp/c14-restore; set -o pipefail; bash scripts/c14/p16/run-isolated-restore.sh 2>&1 | tee /tmp/c14-restore/execution.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-database-restore-${{ github.run_id }}
          path: |
            /tmp/c13-sql/
            /tmp/c14-restore/
          retention-days: 14
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0,persist-credentials: false}
      - run: python3 scripts/c14-integration/scan-secrets.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with: {name: 'c14-secrets-${{ github.run_id }}',path: /tmp/c14-secrets/,retention-days: 14,if-no-files-found: error}
