name: C14-P20 product reality and E2E
on:
  push:
    branches: [parallel/c14-p20-products-e2e]
permissions:
  contents: read
concurrency:
  group: c14-p20-products-e2e
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Install dependencies and Redis
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-fund
          if ! command -v redis-server >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends redis-server
          fi
      - name: Focused C14-P20 regressions
        run: node_modules/.bin/tsx --test scripts/c14/p20-product-boundary.test.ts
      - name: Strict TypeScript
        run: node_modules/.bin/tsc --noEmit --strict --pretty false
      - name: Build worker and production application
        run: |
          set -euo pipefail
          npm run build:audit-worker
          npm run build
      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Re-run proven Basic JSON PDF browser production E2E
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/c12/production-e2e.mjs /tmp/c14-p20/c12
      - name: C14-P20 cross-product production probes
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/c14/p20-products-e2e.mjs /tmp/c14-p20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c14-p20-evidence-${{ github.run_id }}
          path: /tmp/c14-p20
          retention-days: 14
          if-no-files-found: error
