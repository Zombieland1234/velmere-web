name: C8 application request and payment boundary qualification
on:
  push:
    branches: [c8/request-payment-qualification-20260917]
permissions:
  contents: read
concurrency:
  group: c8-application-qualification
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      materialized: ${{ steps.patch.outputs.materialized }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Materialize reviewed source once; never qualify a different trigger SHA
        id: patch
        env:
          C8_PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/c8/reviewed.runtime.patch ]; then
            echo 'materialized=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$GITHUB_REF_NAME" = 'c8/request-payment-qualification-20260917'
          test "$(git rev-parse HEAD^)" = '61a43c4169cd7f1d7937617b0fde9ca7268dd82d'
          cp scripts/c8/reviewed.runtime.patch /tmp/c8.patch
          echo '63360785b4e6d65badf1d349530ee21a5e848b24dc4599f5160f3c2f48b6ee14  /tmp/c8.patch' | sha256sum -c -
          git apply --check /tmp/c8.patch
          git apply /tmp/c8.patch
          git rm scripts/c8/reviewed.runtime.patch
          git diff --check
          git config user.name 'Velmere C8 source integration'
          git config user.email 'c8-integration@users.noreply.github.com'
          git add -A
          git commit -m 'fix(c8): bound body reads and validate real auth and webhook ingress'
          cat > /tmp/c8-askpass.sh <<'SH'
          #!/bin/sh
          case "$1" in *Username*) printf '%s\n' x-access-token;; *) printf '%s\n' "$C8_PUSH_TOKEN";; esac
          SH
          chmod 700 /tmp/c8-askpass.sh
          GIT_ASKPASS=/tmp/c8-askpass.sh GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/c8/request-payment-qualification-20260917
          echo 'materialized=true' >> "$GITHUB_OUTPUT"
          echo 'Source integrated; qualification intentionally requires a new exact-SHA trigger.'
          git rev-parse HEAD
  qualify:
    needs: materialize
    if: needs.materialize.outputs.materialized != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: '1'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
      C6_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.18.0'
      - name: Fresh fixed-SHA application checks
        run: python3 scripts/c8/qualify.py
      - name: Product manifest derived from this source
        if: always()
        run: |
          mkdir -p /tmp/c8-evidence
          if [ -x node_modules/.bin/tsx ]; then
            node_modules/.bin/tsx -e "import{VLM_CANONICAL_CUSTOMER_PRODUCTS as products}from'./lib/product/vlm-canonical-product-topology';import fs from'node:fs';import{createHash}from'node:crypto';const p='lib/product/vlm-canonical-product-topology.ts';fs.writeFileSync('/tmp/c8-evidence/PRODUCT_MANIFEST.json',JSON.stringify({sourceSha:process.env.GITHUB_SHA,at:new Date().toISOString(),path:p,sha256:createHash('sha256').update(fs.readFileSync(p)).digest('hex'),catalogCount:products.length,activeOrSellableCount:'NOT_ASSUMED',products},null,2));"
          fi
      - name: Redacted source and dependency inventories
        if: always()
        continue-on-error: true
        run: |
          mkdir -p /tmp/c8-scan /tmp/c8-tools /tmp/c8-evidence
          git archive HEAD | tar -x -C /tmp/c8-scan
          curl --fail --silent --show-error --location --max-time 60 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/c8-tools/checksums.txt
          curl --fail --silent --show-error --location --max-time 90 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/c8-tools/gitleaks_8.30.1_linux_x64.tar.gz
          (cd /tmp/c8-tools; grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum -c -; tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks)
          python3 - <<'PY'
          import subprocess,pathlib,json,datetime,hashlib,os
          out=pathlib.Path('/tmp/c8-evidence');rows=[]
          commands=[('gitleaks-tracked-source',['/tmp/c8-tools/gitleaks','dir','/tmp/c8-scan','--redact=100','--no-banner','--no-color','--ignore-gitleaks-allow','--max-archive-depth','2','--max-decode-depth','2','--report-format','json','--report-path',str(out/'GITLEAKS_REDACTED.json')]),('dependency-outdated',['npm','outdated','--json']),('software-bill-of-materials',['npm','sbom','--sbom-format','cyclonedx'])]
          for name,args in commands:
            log=out/(name+'.log');start=datetime.datetime.now(datetime.timezone.utc).isoformat()
            with log.open('wb') as f:
              try:code=subprocess.run(args,stdout=f,stderr=subprocess.STDOUT,timeout=240).returncode
              except subprocess.TimeoutExpired:code=124
              except OSError as e:f.write(str(e).encode());code=127
            rows.append(dict(id=name,sourceSha=os.environ['GITHUB_SHA'],startedAt=start,finishedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),command=args,exitCode=code,log=log.name,logSha256=hashlib.sha256(log.read_bytes()).hexdigest(),scope='SOURCE_DIRECTORY_NOT_GIT_HISTORY' if name.startswith('gitleaks') else 'INVENTORY'))
          (out/'ADDITIONAL_SCANS.json').write_text(json.dumps(rows,indent=2))
          PY
      - name: Actual built application desktop and mobile observations
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -x node_modules/.bin/next ] && node -e "const fs=require('fs');const p='/tmp/c8-evidence/QUALIFICATION.json';if(!fs.existsSync(p)||!JSON.parse(fs.readFileSync(p)).some(x=>x.id==='production-build'&&x.result==='PASS'))process.exit(1)"; then
            node_modules/.bin/playwright install --with-deps chromium > /tmp/c8-evidence/browser-install.log 2>&1
            node_modules/.bin/next start --hostname localhost > /tmp/c8-evidence/next-runtime.log 2>&1 &
            server=$!; trap 'kill \"$server\" || true' EXIT
            for i in $(seq 1 30); do if curl -s -o /dev/null http://localhost:3000/en; then break; fi; sleep 1; done
            timeout 300 node scripts/c6/browser-observations.mjs http://localhost:3000 /tmp/c8-evidence/browser > /tmp/c8-evidence/browser.log 2>&1
            timeout 90 node scripts/c6c/provider-outage-browser.mjs /tmp/c8-evidence/failures > /tmp/c8-evidence/controlled-failures.log 2>&1
            timeout 90 node scripts/c6d/reference-pdf-browser.mjs /tmp/c8-evidence/pdf > /tmp/c8-evidence/pdf-browser.log 2>&1
          fi
      - name: Export exact source, blockers and evidence
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,zipfile,hashlib,json,os,datetime
          out=pathlib.Path('/tmp/c8-evidence');out.mkdir(exist_ok=True);src=pathlib.Path('/tmp/c8-source');src.mkdir(exist_ok=True)
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();assert sha==os.environ['GITHUB_SHA']
          rows=json.loads((out/'QUALIFICATION.json').read_text()) if (out/'QUALIFICATION.json').exists() else []
          blockers=[r['id'] for r in rows if r['result']!='PASS']
          inventory=json.loads((out/'SOURCE_INVENTORY.json').read_text()) if (out/'SOURCE_INVENTORY.json').exists() else {}
          if inventory.get('scriptsWithMissingReferencedFiles'):blockers.append('missing-historical-script-files')
          gate=dict(sourceSha=sha,status='NO_GO',technicalBlockers=blockers,externalOrIntegrationGates=['actual-signed-user-auth-e2e','real-stripe-test-lifecycle','hosted-all-product-e2e','provider-rights','independent-review'],ownReviewIsNotExternalAudit=True)
          (out/'RELEASE_GATE.json').write_text(json.dumps(gate,indent=2))
          files=[];excluded=[];omit={'lib/security/pro-audit-pdf/embedded-font-data.ts','r7-runtime/external-assets/manrope-pdf-latin-plus-ext.ttf'}
          with zipfile.ZipFile(src/'VELMERE_SOURCE_C8.zip','w',zipfile.ZIP_DEFLATED) as z:
            for name in subprocess.check_output(['git','ls-files','-z'],text=True).split('\0'):
              if not name:continue
              raw=subprocess.check_output(['git','show','HEAD:'+name]);item=dict(path=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
              if name in omit:excluded.append({**item,'reason':'FONT_RESOURCE_NOT_REDISTRIBUTED'});continue
              files.append(item);z.writestr(name,raw)
          identity=dict(sourceSha=sha,treeSha=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),repository='Zombieland1234/velmere-web',branch=os.environ.get('GITHUB_REF_NAME'),runId=os.environ.get('GITHUB_RUN_ID'),originalUI2ZipIdentityConfirmed=False,trackedFilesIncluded=len(files),excludedTrackedFiles=excluded,files=files,zipSha256=hashlib.sha256((src/'VELMERE_SOURCE_C8.zip').read_bytes()).hexdigest())
          (src/'SOURCE_IDENTITY.json').write_text(json.dumps(identity,indent=2));(out/'SOURCE_IDENTITY_EXPORT.json').write_text(json.dumps({k:v for k,v in identity.items() if k!='files'},indent=2))
          subprocess.run(['git','status','--porcelain'],stdout=(out/'final-working-tree-status.txt').open('w'),check=True)
          items=[dict(path=str(p.relative_to(out)),bytes=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest()) for p in sorted(out.rglob('*')) if p.is_file()]
          (out/'EVIDENCE_MANIFEST.json').write_text(json.dumps(dict(sourceSha=sha,recordedAt=datetime.datetime.now(datetime.timezone.utc).isoformat(),files=items),indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c8-source-${{ github.run_id }}
          path: /tmp/c8-source
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: c8-evidence-${{ github.run_id }}
          path: /tmp/c8-evidence
          retention-days: 14
          if-no-files-found: error
      - name: Preserve red technical gate; no production promotion
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path('/tmp/c8-evidence/RELEASE_GATE.json')
          if not p.exists():sys.exit('NO_GO: evidence missing')
          gate=json.loads(p.read_text())
          print(json.dumps(gate,indent=2))
          if gate['technicalBlockers']:sys.exit(1)
          print('Selected technical checks passed; the whole product is still NO_GO.')
          PY
