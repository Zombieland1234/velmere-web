name: C15 Q4 isolated entitlement persistence qualification
'on':
  push:
    branches:
    - c15/qualification-q4-20260918
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: c15-q4-qualification
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QUALIFIED_SHA: ${{ github.sha }}
      C6_SOURCE_SHA: ${{ github.sha }}
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
      RAYON_NUM_THREADS: '2'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.18.0
    - name: Fresh install scripts regressions strict lint and production build
      run: export GITHUB_SHA="$QUALIFIED_SHA"; python3 scripts/c14-integration/qualify-core.py
    - if: always()
      run: export GITHUB_SHA="$QUALIFIED_SHA"; python3 scripts/c14-integration/export-source.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-core-${{ github.run_id }}-${{ github.run_attempt }}
        path: /tmp/c14-integration/
        retention-days: 14
        if-no-files-found: error
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-source-${{ github.run_id }}-${{ github.run_attempt }}
        path: /tmp/c14-source/
        retention-days: 14
        if-no-files-found: error
  frozen-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QUALIFIED_SHA: ${{ github.sha }}
      VELMERE_BENCHMARK_BASELINE_SHA: e718df06d20a8129ffe261eef9c6c74cc5c91729
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.18.0
    - name: Full frozen corpus, unchanged labels, no chain execution
      run: export GITHUB_SHA="$QUALIFIED_SHA"; bash scripts/c14-integration/benchmark.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
        path: '/tmp/c14-benchmark

          !/tmp/c14-benchmark/private-inputs.json

          !/tmp/c14-benchmark/*-engine.cjs

          '
        retention-days: 14
        if-no-files-found: error
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QUALIFIED_SHA: ${{ github.sha }}
      C6_SOURCE_SHA: ${{ github.sha }}
      CI: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=2048
      RAYON_NUM_THREADS: '2'
      VELMERE_CANONICAL_ORIGIN: http://localhost:3000
      VELMERE_LOOPBACK_HTTP_BROWSER_PROOF: 'true'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 24.18.0
    - run: 'mkdir -p /tmp/c14-runtime

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends redis-server

        node --version > /tmp/c14-runtime/NODE_VERSION.txt

        redis-server --version > /tmp/c14-runtime/REDIS_VERSION.txt

        printf ''%s\n'' "$QUALIFIED_SHA" > /tmp/c14-runtime/SOURCE_SHA.txt

        '
    - run: npm ci --ignore-scripts --no-fund
    - name: Real Redis checks on private temporary instance
      run: export GITHUB_SHA="$QUALIFIED_SHA"; set -o pipefail; bash scripts/c12/redis-tests.sh 2>&1 | tee /tmp/c14-runtime/redis-tests.log
    - name: Full production bundle
      run: export GITHUB_SHA="$QUALIFIED_SHA"; set -o pipefail; npm run build 2>&1 | tee /tmp/c14-runtime/build.log
    - run: node_modules/.bin/playwright install --with-deps chromium
    - name: Dynamic Basic JSON PDF browser quota and recovery
      run: export GITHUB_SHA="$QUALIFIED_SHA"; set -o pipefail; node scripts/c12/production-e2e.mjs /tmp/c14-runtime/e2e 2>&1 | tee /tmp/c14-runtime/e2e.log
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-runtime-${{ github.run_id }}-${{ github.run_attempt }}
        path: /tmp/c14-runtime/
        retention-days: 14
        if-no-files-found: error
  database-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: c14_ephemeral_ci_only
          POSTGRES_DB: c14_fixture
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUALIFIED_SHA: ${{ github.sha }}
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: c14_ephemeral_ci_only
      PGDATABASE: c14_fixture
      C14_DISPOSABLE_RESTORE_ACK: ISOLATED_CI_ONLY
      C14_P16_EVIDENCE_DIR: /tmp/c14-restore
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends redis-server
    - name: Canonical Shield PostgreSQL regression
      run: 'export GITHUB_SHA="$QUALIFIED_SHA"

        mkdir -p /tmp/c13-sql

        createdb c13_fixture

        set -o pipefail

        PGDATABASE=c13_fixture python3 scripts/c13/shield-db-test.py 2>&1 | tee /tmp/c13-sql/execution.log

        '
    - name: Disposable PostgreSQL Redis object-file restore drill
      run: export GITHUB_SHA="$QUALIFIED_SHA"; mkdir -p /tmp/c14-restore; set -o pipefail; bash scripts/c14/p16/run-isolated-restore.sh 2>&1 | tee /tmp/c14-restore/execution.log
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-database-restore-${{ github.run_id }}-${{ github.run_attempt }}
        path: '/tmp/c13-sql/

          /tmp/c14-restore/

          '
        retention-days: 14
        if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QUALIFIED_SHA: ${{ github.sha }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - run: export GITHUB_SHA="$QUALIFIED_SHA"; python3 scripts/c14-integration/scan-secrets.py
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-secrets-${{ github.run_id }}-${{ github.run_attempt }}
        path: /tmp/c14-secrets/
        retention-days: 14
        if-no-files-found: error
  entitlement-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: q4_disposable_ci_only
          POSTGRES_DB: q4_entitlement_fixture
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: q4_disposable_ci_only
      PGDATABASE: q4_entitlement_fixture
      Q4_DISPOSABLE_ACK: ISOLATED_TEST_ONLY
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Native SQL, concurrency, rollback and logical restore
      run: |
        # Run the original backup clients from the SAME pulled image as the server.
        # Host psql is protocol-compatible; pg_dump must not be older than server.
        mkdir -p /tmp/q4-pg-bin
        export Q4_PG_CLIENT_IMAGE="$(docker image inspect postgres:17 --format '{{.Id}}')"
        for tool in pg_dump pg_restore; do
          cat > "/tmp/q4-pg-bin/$tool" <<'CLIENT'
        #!/usr/bin/env bash
        set -euo pipefail
        exec docker run --rm --network host -v /tmp:/tmp \
          -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE \
          "$Q4_PG_CLIENT_IMAGE" "$(basename "$0")" "$@"
        CLIENT
          chmod 700 "/tmp/q4-pg-bin/$tool"
        done
        export PATH="/tmp/q4-pg-bin:$PATH"
        printf 'PostgreSQL client image: %s\n' "$Q4_PG_CLIENT_IMAGE"
        psql --version
        pg_dump --version
        pg_restore --version
        python3 scripts/c15-q4/native-postgres.py /tmp/c15-q4-postgres
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: c15-q4-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        path: /tmp/c15-q4-postgres
        retention-days: 14
        if-no-files-found: error
