name: Across bounty - Velmere audit

on:
  push:
    branches:
      - bounty/across-spokeperiphery-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACROSS_SHA: 7445f72de17900544605c7e6706c5fb3b3784738
      VELMERE_SHA: e718df06d20a8129ffe261eef9c6c74cc5c91729
    steps:
      - name: Checkout Velmere
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Velmere dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Checkout pinned Across source
        run: |
          git clone --filter=blob:none https://github.com/across-protocol/contracts.git /tmp/across-contracts
          cd /tmp/across-contracts
          git checkout "$ACROSS_SHA"
          git submodule update --init --recursive
          corepack enable
          yarn install --immutable

      - name: Pin Across Foundry toolchain and compile
        run: |
          cd /tmp/across-contracts
          yarn pin-foundry
          yarn build-evm-foundry

      - name: Locate SpokePoolPeriphery artifact
        id: artifact
        shell: bash
        run: |
          ARTIFACT="$(find /tmp/across-contracts/out -type f -path '*/SpokePoolPeriphery.sol/SpokePoolPeriphery.json' | head -n 1)"
          test -n "$ARTIFACT"
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Run Velmere ADVANCED audit
        run: |
          mkdir -p artifacts/bounty
          npx tsx scripts/bounty/run-across-spokeperiphery.ts             /tmp/across-contracts/contracts/periphery/SpokePoolPeriphery.sol             "${{ steps.artifact.outputs.path }}"             artifacts/bounty/across-spokeperiphery-velmere.json

      - name: Emit compact finding summary
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const p = "artifacts/bounty/across-spokeperiphery-velmere.json";
          const x = JSON.parse(fs.readFileSync(p, "utf8"));
          const rows = x.result.findings.map(f => ({
            id: f.id,
            title: f.title,
            severity: f.severity,
            confidence: f.confidence,
            status: f.status,
            category: f.category,
            evidenceClass: f.evidenceClass,
          }));
          fs.writeFileSync("artifacts/bounty/across-spokeperiphery-findings-summary.json", JSON.stringify({
            target: x.target,
            engine: x.engine,
            scores: x.result.scores,
            cfgMetrics: x.result.cfgMetrics,
            findingCount: rows.length,
            findings: rows,
          }, null, 2));
          console.log(JSON.stringify(rows, null, 2));
          NODE

      - name: Upload bounty audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: across-spokeperiphery-velmere-audit
          path: artifacts/bounty/
          if-no-files-found: error
