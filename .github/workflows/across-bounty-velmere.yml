name: Across bounty - Velmere audit

on:
  push:
    branches:
      - bounty/across-spokeperiphery-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ACROSS_SHA: 7445f72de17900544605c7e6706c5fb3b3784738
      VELMERE_SHA: e718df06d20a8129ffe261eef9c6c74cc5c91729
    steps:
      - name: Checkout Velmere
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Velmere dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Foundry bootstrap
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Checkout pinned Across source
        run: |
          git clone --filter=blob:none https://github.com/across-protocol/contracts.git /tmp/across-contracts
          cd /tmp/across-contracts
          git checkout "$ACROSS_SHA"
          git submodule update --init --recursive
          corepack enable
          yarn install --immutable

      - name: Pin Across Foundry toolchain and compile target
        run: |
          export PATH="$HOME/.config/.foundry/bin:$HOME/.foundry/bin:$PATH"
          cd /tmp/across-contracts
          yarn pin-foundry
          forge --version
          forge build contracts/periphery/SpokePoolPeriphery.sol

      - name: Locate SpokePoolPeriphery artifact
        id: artifact
        shell: bash
        run: |
          ARTIFACT="$(find /tmp/across-contracts/out -type f -path '*/SpokePoolPeriphery.sol/SpokePoolPeriphery.json' | head -n 1)"
          test -n "$ARTIFACT"
          echo "path=$ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Run Velmere ADVANCED audit
        run: |
          mkdir -p artifacts/bounty
          npx tsx scripts/bounty/run-across-spokeperiphery.ts \
            /tmp/across-contracts/contracts/periphery/SpokePoolPeriphery.sol \
            "${{ steps.artifact.outputs.path }}" \
            artifacts/bounty/across-spokeperiphery-velmere.json

      - name: Remove private finding payload
        if: always()
        run: rm -rf artifacts/bounty
