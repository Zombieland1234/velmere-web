name: Across bounty - Velmere fresh-surface audit

on:
  push:
    branches:
      - bounty/across-spokeperiphery-20260918
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACROSS_SHA: 7445f72de17900544605c7e6706c5fb3b3784738
      VELMERE_SHA: e718df06d20a8129ffe261eef9c6c74cc5c91729
    steps:
      - name: Checkout Velmere
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Velmere dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Foundry bootstrap
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Checkout pinned Across source
        run: |
          git clone --filter=blob:none https://github.com/across-protocol/contracts.git /tmp/across-contracts
          cd /tmp/across-contracts
          git checkout "$ACROSS_SHA"
          git submodule update --init --recursive
          corepack enable
          yarn install --immutable
      - name: Pin Across Foundry toolchain
        run: |
          export PATH="$HOME/.config/.foundry/bin:$HOME/.foundry/bin:$PATH"
          cd /tmp/across-contracts
          yarn pin-foundry
          forge --version
      - name: Compile fresh bounty targets
        run: |
          export PATH="$HOME/.config/.foundry/bin:$HOME/.foundry/bin:$PATH"
          cd /tmp/across-contracts
          for source in \
            contracts/periphery/counterfactual/CounterfactualDepositSpokePool.sol \
            contracts/periphery/counterfactual/CounterfactualDepositCCTP.sol \
            contracts/periphery/counterfactual/CounterfactualDepositVanillaCCTP.sol \
            contracts/periphery/counterfactual/CounterfactualDepositOFT.sol \
            contracts/periphery/counterfactual/WithdrawImplementation.sol \
            contracts/periphery/mintburn/HyperCoreFlowExecutor.sol \
            contracts/periphery/mintburn/ArbitraryEVMFlowExecutor.sol \
            contracts/periphery/mintburn/SwapHandler.sol \
            contracts/periphery/mintburn/sponsored-cctp/SponsoredCCTPSrcPeriphery.sol \
            contracts/periphery/mintburn/sponsored-cctp/SponsoredCCTPDstPeriphery.sol \
            contracts/periphery/mintburn/sponsored-oft/SponsoredOFTSrcPeriphery.sol \
            contracts/spoke-pools/Universal_SpokePool.sol
          do
            forge build "$source"
          done
      - name: Run Velmere ADVANCED fresh-surface batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bounty
          run_target () {
            local source="$1"
            local contract="$2"
            local artifact
            artifact="$(find /tmp/across-contracts/out -type f -path "*/$(basename "$source")/$contract.json" | head -n 1 || true)"
            echo "=== VELMERE_TARGET $contract ==="
            if [ -z "$artifact" ]; then
              echo "{"schema":"velmere.bounty.public-aggregate.v1","contractName":"$contract","status":"SKIPPED_ARTIFACT_NOT_FOUND"}"
              return 0
            fi
            npx tsx scripts/bounty/run-across-spokeperiphery.ts \
              "/tmp/across-contracts/$source" \
              "$artifact" \
              "$contract" \
              "artifacts/bounty/$contract.json"
            rm -f "artifacts/bounty/$contract.json"
          }
          run_target contracts/periphery/counterfactual/CounterfactualDepositSpokePool.sol CounterfactualDepositSpokePool
          run_target contracts/periphery/counterfactual/CounterfactualDepositCCTP.sol CounterfactualDepositCCTP
          run_target contracts/periphery/counterfactual/CounterfactualDepositVanillaCCTP.sol CounterfactualDepositVanillaCCTP
          run_target contracts/periphery/counterfactual/CounterfactualDepositOFT.sol CounterfactualDepositOFT
          run_target contracts/periphery/counterfactual/WithdrawImplementation.sol WithdrawImplementation
          run_target contracts/periphery/mintburn/HyperCoreFlowExecutor.sol HyperCoreFlowExecutor
          run_target contracts/periphery/mintburn/ArbitraryEVMFlowExecutor.sol ArbitraryEVMFlowExecutor
          run_target contracts/periphery/mintburn/SwapHandler.sol SwapHandler
          run_target contracts/periphery/mintburn/sponsored-cctp/SponsoredCCTPSrcPeriphery.sol SponsoredCCTPSrcPeriphery
          run_target contracts/periphery/mintburn/sponsored-cctp/SponsoredCCTPDstPeriphery.sol SponsoredCCTPDstPeriphery
          run_target contracts/periphery/mintburn/sponsored-oft/SponsoredOFTSrcPeriphery.sol SponsoredOFTSrcPeriphery
          run_target contracts/spoke-pools/Universal_SpokePool.sol Universal_SpokePool
      - name: Remove private finding payload
        if: always()
        run: rm -rf artifacts/bounty
